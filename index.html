<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Türkiye Kütük Nüfus Haritası</title>
    <meta
      name="description"
      content="Türkiye Kütük Haritası, TÜİK ADNKS 2008–2025 verisiyle etkileşimli harita. Herkes kendi ilinde yaşasaydı Türkiye illerinin nüfusu nasıl olurdu?"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="theme-color" content="#f4f1ea" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      {
        const stored = localStorage.getItem("kutuk-theme");
        const theme =
          stored === "dark" || stored === "light"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        const color = document.querySelector('meta[name="theme-color"]');
        if (color) color.content = theme === "dark" ? "#161411" : "#f4f1ea";
      }
    </script>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <p class="masthead">Türkiye Kütük Nüfus Haritası</p>
        <h1>Herkes kütüğünün bulunduğu ilde yaşasaydı nüfus nasıl olurdu?</h1>
      </header>

      <div class="toolbar">
        <div class="modes" role="tablist" aria-label="Harita görünümü">
          <button type="button" class="mode is-active" data-mode="kutuk">
            Kütük<span class="mode-extra"> nüfusu</span>
          </button>
          <button type="button" class="mode" data-mode="ikamet">
            İkamet<span class="mode-extra"> nüfusu</span>
          </button>
          <button type="button" class="mode" data-mode="fark">Fark</button>
        </div>
        <div class="year-wrap">
          <div class="year-stepper">
            <button type="button" id="year-prev" class="year-step" aria-label="Önceki yıl">
              ‹
            </button>
            <div class="year-readout">
              <label class="year-label" for="year">Yıl</label>
              <span id="year-display" class="year-display"></span>
            </div>
            <button type="button" id="year-next" class="year-step" aria-label="Sonraki yıl">
              ›
            </button>
          </div>
          <input id="year" type="range" />
          <div id="year-buttons" class="years" role="tablist" aria-label="Yıl"></div>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Koyu görünüme geç">
          <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M15.2 3.1a1 1 0 0 1 1.1 1.5 7.5 7.5 0 1 0 3.1 3.1 1 1 0 0 1 1.5 1.1A9.5 9.5 0 1 1 15.2 3.1z"
            />
          </svg>
          <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="currentColor" />
            <path
              fill="currentColor"
              d="M11 2h2v3h-2zm0 17h2v3h-2zM2 11h3v2H2zm17 0h3v2h-3zM4.2 3.8l1.4-1.4 2.1 2.1-1.4 1.4zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM3.8 19.8l1.4 1.4 2.1-2.1-1.4-1.4zm12.1-12.1 1.4 1.4 2.1-2.1-1.4-1.4z"
            />
          </svg>
        </button>
      </div>

      <main class="layout">
        <section class="map-panel" id="map-panel">
          <div class="map-frame">
            <div id="map" aria-label="Türkiye il haritası"></div>
            <div class="map-zoom" role="group" aria-label="Harita yakınlaştırma">
              <button type="button" id="zoom-in" aria-label="Yakınlaştır">+</button>
              <button type="button" id="zoom-out" aria-label="Uzaklaştır">−</button>
              <button type="button" id="zoom-reset" aria-label="Yakınlaştırmayı sıfırla">↺</button>
              <button type="button" id="zoom-full" aria-label="Tam ekran" aria-pressed="false">
                ⛶
              </button>
            </div>
          </div>
          <div id="legend" class="legend"></div>
          <div id="tooltip" class="tooltip" hidden></div>
        </section>

        <aside class="list-panel">
          <div class="list-head">
            <h2 id="list-title" class="list-title">Sıralama · Kütük</h2>
            <label class="sr-only" for="search">İl ara</label>
            <input id="search" type="search" placeholder="Örneğin; İzmir" />
          </div>
          <ol id="ranking" class="ranking"></ol>
        </aside>
      </main>

      <footer class="footer">
        <p class="source">
          <span id="source-year">Kaynak: TÜİK, Adrese Dayalı Nüfus Kayıt Sistemi.</span>
          Kütük nüfusu yalnızca T.C. vatandaşlarını; ikamet nüfusu yabancı
          uyruklular dahil tüm ADNKS nüfusunu kapsar.
        </p>
      </footer>
    </div>

    <button type="button" id="scroll-top" class="scroll-top" aria-label="Yukarı çık">
      ↑
    </button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
